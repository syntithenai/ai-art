<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Art — Australian News</title>
  <style>
    :root {
      --bg: #0f1210;
      --panel: #1a1f1c;
      --ink: #e8ebe4;
      --muted: #9aa396;
      --accent: #c4a574;
      --line: #2a312c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #243028 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #2a2218 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 2.5rem 1.25rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
    }
    .sub {
      color: var(--muted);
      max-width: 40rem;
      line-height: 1.45;
      margin: 0 0 1.5rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      align-items: center;
    }
    .control {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.75rem;
      align-items: center;
      flex: 1 1 280px;
    }
    label { color: var(--muted); font-size: 0.95rem; white-space: nowrap; }
    input[type="search"] {
      flex: 1 1 160px;
      min-width: 140px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 0.7rem 0.9rem;
      font: inherit;
      border-radius: 2px;
    }
    input[type="search"]:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.5rem 1.25rem 3rem;
    }
    .run {
      margin: 2rem 0 3rem;
    }
    .run-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.6rem;
      margin-bottom: 1rem;
    }
    .run-head h2 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
    }
    .meta { color: var(--muted); font-size: 0.95rem; }
    .themes {
      width: 100%;
      color: var(--accent);
      font-size: 0.9rem;
    }
    .run-summary {
      width: 100%;
      margin: 0.55rem 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
      max-width: 52rem;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    figure {
      margin: 0;
    }
    figure img {
      width: 100%;
      height: auto;
      display: block;
      background: var(--panel);
      border: 1px solid var(--line);
      cursor: zoom-in;
    }
    figcaption {
      margin-top: 0.45rem;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.35;
    }
    figcaption a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    figcaption a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .empty {
      color: var(--muted);
      padding: 2rem 0;
    }
    a { color: var(--accent); }

    /* Fullscreen lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.92);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: min(96vw, 1400px);
      max-height: 94vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      cursor: default;
    }
    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      background: transparent;
      border: none;
      color: var(--ink);
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.8;
    }
    .lightbox-close:hover { opacity: 1; }

    /* Detail view */
    .detail-back {
      display: inline-block;
      margin-bottom: 1.25rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .detail-back:hover { text-decoration: underline; }
    .detail {
      max-width: 720px;
    }
    .detail > img.hero {
      width: 100%;
      height: auto;
      display: block;
      background: var(--panel);
      border: 1px solid var(--line);
      cursor: zoom-in;
    }
    .detail h2 {
      margin: 1.25rem 0 0.35rem;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .detail .meta { margin-bottom: 1rem; }
    .detail .desc {
      line-height: 1.55;
      color: var(--ink);
      white-space: pre-wrap;
      margin-bottom: 0.75rem;
    }
    .detail .generated-by {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0 0 2rem;
    }
    .batch-strip-label {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 0.6rem;
    }
    .batch-strip {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.25rem 0 0.75rem;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .batch-strip::-webkit-scrollbar {
      height: 6px;
    }
    .batch-strip::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 3px;
    }
    .batch-card {
      flex: 0 0 140px;
      scroll-snap-align: start;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 0;
      cursor: pointer;
      display: block;
      overflow: hidden;
    }
    .batch-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .batch-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .batch-card span {
      display: block;
      padding: 0.4rem 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .batch-card.active span { color: var(--accent); }
    .home-controls.hidden { display: none; }

    button.artist-link {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      font: inherit;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      text-align: left;
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 1px;
    }
    button.artist-link:hover { color: var(--ink); }
    .run-head h2 .artist-link { font-size: inherit; font-weight: inherit; }

    .artist-dialog {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1100;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .artist-dialog.open { display: flex; }
    .artist-dialog-panel {
      width: min(520px, 100%);
      max-height: min(88vh, 720px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 1.25rem 1.35rem 1.5rem;
      position: relative;
      box-shadow: 0 16px 48px rgba(0,0,0,0.45);
    }
    .artist-dialog-close {
      position: absolute;
      top: 0.65rem;
      right: 0.85rem;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.75rem;
      line-height: 1;
      cursor: pointer;
    }
    .artist-dialog-close:hover { color: var(--ink); }
    .artist-dialog-photo {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      object-position: center top;
      display: block;
      background: #111;
      border: 1px solid var(--line);
      margin: 0 0 1rem;
    }
    .artist-dialog h3 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      font-weight: 600;
      padding-right: 1.5rem;
    }
    .artist-dialog .artist-meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 0.85rem;
    }
    .artist-dialog .artist-bio {
      color: var(--ink);
      font-size: 0.95rem;
      line-height: 1.55;
      margin: 0;
      white-space: pre-wrap;
    }
    .artist-dialog .artist-credit {
      color: var(--muted);
      font-size: 0.75rem;
      margin: 0.85rem 0 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>AI Art</h1>
    <p class="sub">Daily artworks from Australian and world news — with a bias toward science, people, and good news.</p>
    <div class="controls home-controls" id="homeControls">
      <div class="control">
        <label for="artistFilter">Artist</label>
        <input id="artistFilter" type="search" placeholder="e.g. Hopper, Nolan…" autocomplete="off" />
      </div>
      <div class="control">
        <label for="topicFilter">Topic</label>
        <input id="topicFilter" type="search" placeholder="e.g. climate, housing…" autocomplete="off" />
      </div>
    </div>
  </header>
  <main id="gallery"><p class="empty">Loading…</p></main>
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Fullscreen image">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <img id="lightboxImg" alt="" />
  </div>
  <div id="artistDialog" class="artist-dialog" role="dialog" aria-modal="true" aria-labelledby="artistDialogName" hidden>
    <div class="artist-dialog-panel">
      <button type="button" class="artist-dialog-close" id="artistDialogClose" aria-label="Close">&times;</button>
      <img id="artistDialogPhoto" class="artist-dialog-photo" alt="" hidden />
      <h3 id="artistDialogName"></h3>
      <p class="artist-meta" id="artistDialogMeta"></p>
      <p class="artist-bio" id="artistDialogBio"></p>
      <p class="artist-credit" id="artistDialogCredit" hidden></p>
    </div>
  </div>
  <script>
    async function load() {
      const res = await fetch('gallery.json?_=' + Date.now());
      const data = await res.json();
      const runs = data.runs || [];
      const main = document.getElementById('gallery');
      const artistInput = document.getElementById('artistFilter');
      const topicInput = document.getElementById('topicFilter');
      const homeControls = document.getElementById('homeControls');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      const artistDialog = document.getElementById('artistDialog');
      const artistDialogPhoto = document.getElementById('artistDialogPhoto');
      const artistDialogName = document.getElementById('artistDialogName');
      const artistDialogMeta = document.getElementById('artistDialogMeta');
      const artistDialogBio = document.getElementById('artistDialogBio');
      const artistDialogCredit = document.getElementById('artistDialogCredit');

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }
      function escapeAttr(s) { return escapeHtml(s); }

      function formatAuDate(iso) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '').trim());
        if (!m) return String(iso || '');
        return m[3] + '/' + m[2] + '/' + m[1];
      }

      function imageCaption(img) {
        const title = img.title || '';
        const year = String(img.fashionYear || '').trim();
        if (year) return title + ' · ' + year;
        return title;
      }

      function artistButton(artist) {
        const a = artist || {};
        const name = a.name || 'Unknown';
        const payload = encodeURIComponent(JSON.stringify({
          name: a.name || '',
          era: a.era || '',
          renderMode: a.renderMode || '',
          bio: a.bio || '',
          photoUrl: a.photoUrl || '',
          photoCredit: a.photoCredit || '',
          tags: a.tags || []
        }));
        return `<button type="button" class="artist-link" data-artist-json="${payload}">${escapeHtml(name)}</button>`;
      }

      function openArtistDialog(raw) {
        let a = {};
        try { a = JSON.parse(decodeURIComponent(raw || '%7B%7D')); } catch (e) { a = {}; }
        artistDialogName.textContent = a.name || 'Artist';
        const bits = [a.era, a.renderMode].filter(Boolean);
        artistDialogMeta.textContent = bits.join(' · ');
        artistDialogBio.textContent = (a.bio || '').trim() || 'No biography available yet.';
        if (a.photoUrl) {
          artistDialogPhoto.src = a.photoUrl;
          artistDialogPhoto.alt = a.name || 'Artist portrait';
          artistDialogPhoto.hidden = false;
        } else {
          artistDialogPhoto.removeAttribute('src');
          artistDialogPhoto.hidden = true;
        }
        if (a.photoCredit) {
          artistDialogCredit.textContent = 'Photo: ' + a.photoCredit;
          artistDialogCredit.hidden = false;
        } else {
          artistDialogCredit.hidden = true;
        }
        artistDialog.hidden = false;
        artistDialog.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeArtistDialog() {
        artistDialog.classList.remove('open');
        artistDialog.hidden = true;
        document.body.style.overflow = '';
      }

      function parseRoute() {
        const raw = location.hash.replace(/^#\/?/, '');
        const parts = raw.split('/').filter(Boolean);
        if (parts.length >= 2 && /^\d{4}-\d{2}-\d{2}$/.test(parts[0])) {
          return { view: 'detail', date: parts[0], index: parseInt(parts[1], 10) };
        }
        if (parts.length === 1 && /^\d{4}-\d{2}-\d{2}$/.test(parts[0])) {
          return { view: 'home', date: parts[0], index: null };
        }
        return { view: 'home', date: '', index: null };
      }

      function findImage(date, index) {
        const run = runs.find(r => r.date === date);
        if (!run) return null;
        const img = (run.images || []).find(i => Number(i.index) === Number(index));
        if (!img) return null;
        return { run, img };
      }

      function openLightbox(src, alt) {
        lightboxImg.src = src;
        lightboxImg.alt = alt || '';
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        lightbox.classList.remove('open');
        lightboxImg.removeAttribute('src');
        document.body.style.overflow = '';
      }
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target === document.getElementById('lightboxClose')) {
          closeLightbox();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
      });

      function syncFiltersFromUrl() {
        const params = new URLSearchParams(location.search);
        const a = params.get('artist') || '';
        const t = params.get('topic') || '';
        if (a && !artistInput.value) artistInput.value = a;
        if (t && !topicInput.value) topicInput.value = t;
      }

      function writeFiltersToUrl() {
        const url = new URL(location.href);
        const a = artistInput.value.trim();
        const t = topicInput.value.trim();
        if (a) url.searchParams.set('artist', a); else url.searchParams.delete('artist');
        if (t) url.searchParams.set('topic', t); else url.searchParams.delete('topic');
        history.replaceState(null, '', url);
      }

      function matchesFilters(run) {
        const aq = (artistInput.value || '').trim().toLowerCase();
        const tq = (topicInput.value || '').trim().toLowerCase();
        if (aq) {
          const hay = ((run.artist && run.artist.name) || '') + ' ' + ((run.artist && run.artist.id) || '');
          if (!hay.toLowerCase().includes(aq)) return false;
        }
        if (tq) {
          const themes = (run.themes || []).join(' ');
          const titles = (run.images || []).map(i => i.title || '').join(' ');
          const summary = run.summary || '';
          const hay = themes + ' ' + titles + ' ' + summary;
          if (!hay.toLowerCase().includes(tq)) return false;
        }
        return true;
      }

      function renderHome() {
        homeControls.classList.remove('hidden');
        syncFiltersFromUrl();
        const route = parseRoute();
        const filtered = runs.filter(r => {
          if (route.date && r.date !== route.date) return false;
          return matchesFilters(r);
        });
        if (!filtered.length) {
          main.innerHTML = '<p class="empty">No runs match this filter.</p>';
          return;
        }
        main.innerHTML = filtered.map(run => {
          const themes = (run.themes || []).join(' · ');
          const imgs = (run.images || []).map(img => {
            const src = 'runs/' + run.date + '/' + (img.jpg || img.png);
            const idx = img.index;
            const title = img.title || '';
            const caption = imageCaption(img);
            return `
            <figure>
              <img src="${escapeAttr(src)}" alt="${escapeAttr(title)}" loading="lazy"
                   data-fullsrc="${escapeAttr(src)}" data-action="fullscreen" />
              <figcaption>
                <a href="#/${escapeAttr(run.date)}/${escapeAttr(String(idx))}">${escapeHtml(caption)}</a>
              </figcaption>
            </figure>`;
          }).join('');
          const summary = (run.summary || '').trim();
          return `
            <section class="run" data-artist="${escapeAttr((run.artist && run.artist.name) || '')}" id="${run.date}">
              <div class="run-head">
                <h2>${artistButton(run.artist)}</h2>
                <span class="meta">${escapeHtml(formatAuDate(run.date))} · ${escapeHtml((run.artist && run.artist.renderMode) || '')}</span>
                ${themes ? `<div class="themes">${escapeHtml(themes)}</div>` : ''}
                ${summary ? `<p class="run-summary">${escapeHtml(summary)}</p>` : ''}
              </div>
              <div class="grid">${imgs}</div>
            </section>`;
        }).join('');
      }

      function renderDetail(date, index) {
        homeControls.classList.add('hidden');
        const found = findImage(date, index);
        if (!found) {
          main.innerHTML = '<p class="empty">Artwork not found. <a href="#">Back</a></p>';
          return;
        }
        const { run, img } = found;
        const src = 'runs/' + run.date + '/' + (img.jpg || img.png);
        const title = img.title || 'Untitled';
        const desc = img.prompt || run.summary || '';
        const backHref = '#/' + run.date;
        const models = run.models || {};
        const imageModel = models.image || 'Flux Klein';
        const llmModel = models.llm || '';
        const generatedBy = llmModel
          ? ('Generated by ' + imageModel + ' · prompts via ' + llmModel)
          : ('Generated by ' + imageModel);
        const cards = (run.images || []).map(im => {
          const csrc = 'runs/' + run.date + '/' + (im.jpg || im.png);
          const active = Number(im.index) === Number(index) ? ' active' : '';
          return `
            <a class="batch-card${active}" href="#/${escapeAttr(run.date)}/${escapeAttr(String(im.index))}" title="${escapeAttr(im.title || '')}">
              <img src="${escapeAttr(csrc)}" alt="${escapeAttr(im.title || '')}" loading="lazy" />
              <span>${escapeHtml(imageCaption(im) || ('#' + im.index))}</span>
            </a>`;
        }).join('');
        main.innerHTML = `
          <article class="detail">
            <a class="detail-back" href="${escapeAttr(backHref)}">&larr; Back</a>
            <img class="hero" src="${escapeAttr(src)}" alt="${escapeAttr(title)}"
                 data-fullsrc="${escapeAttr(src)}" data-action="fullscreen" />
            <h2>${escapeHtml(title)}</h2>
            <p class="meta">${artistButton(run.artist)} · ${escapeHtml(formatAuDate(run.date))} · ${escapeHtml((run.artist && run.artist.renderMode) || '')}${img.fashionYear ? ' · ' + escapeHtml(String(img.fashionYear)) : ''}</p>
            <div class="desc">${escapeHtml(desc)}</div>
            <p class="generated-by">${escapeHtml(generatedBy)}</p>
            <p class="batch-strip-label">This day’s artworks</p>
            <div class="batch-strip">${cards}</div>
          </article>`;
        const activeCard = main.querySelector('.batch-card.active');
        if (activeCard) {
          activeCard.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
        }
      }

      function render() {
        const route = parseRoute();
        if (route.view === 'detail') {
          renderDetail(route.date, route.index);
        } else {
          renderHome();
        }
      }

      main.addEventListener('click', (e) => {
        const t = e.target;
        if (!(t instanceof Element)) return;
        const artistBtn = t.closest('[data-artist-json]');
        if (artistBtn) {
          e.preventDefault();
          openArtistDialog(artistBtn.getAttribute('data-artist-json'));
          return;
        }
        const img = t.closest('[data-action="fullscreen"]');
        if (img) {
          e.preventDefault();
          openLightbox(img.getAttribute('data-fullsrc') || img.getAttribute('src'), img.getAttribute('alt'));
        }
      });

      document.getElementById('artistDialogClose').addEventListener('click', (e) => {
        e.stopPropagation();
        closeArtistDialog();
      });
      artistDialog.addEventListener('click', (e) => {
        if (e.target === artistDialog) closeArtistDialog();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && artistDialog.classList.contains('open')) closeArtistDialog();
      });

      function onFilterInput() {
        writeFiltersToUrl();
        if (parseRoute().view === 'home') render();
      }
      artistInput.addEventListener('input', onFilterInput);
      topicInput.addEventListener('input', onFilterInput);
      window.addEventListener('hashchange', render);
      render();
    }
    load().catch(err => {
      document.getElementById('gallery').innerHTML =
        '<p class="empty">Could not load gallery.json</p>';
      console.error(err);
    });
  </script>
</body>
</html>
