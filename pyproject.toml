[project]
name = "ai-art"
version = "0.1.0"
description = "Daily Australian news AI art pipeline (Qwen + Comfy + GitHub Pages)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pillow>=10.0",
  "python-dotenv>=1.0",
]

[project.scripts]
ai-art = "ai_art.run:main"

[tool.setuptools.packages.find]
include = ["ai_art*"]
