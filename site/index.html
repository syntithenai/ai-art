<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Art — Australian News</title>
  <style>
    :root {
      --bg: #0f1210;
      --panel: #1a1f1c;
      --ink: #e8ebe4;
      --muted: #9aa396;
      --accent: #c4a574;
      --line: #2a312c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #243028 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #2a2218 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 2.5rem 1.25rem 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
    }
    .sub {
      color: var(--muted);
      max-width: 40rem;
      line-height: 1.45;
      margin: 0 0 1.5rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    label { color: var(--muted); font-size: 0.95rem; }
    input[type="search"] {
      flex: 1 1 240px;
      min-width: 200px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 0.7rem 0.9rem;
      font: inherit;
      border-radius: 2px;
    }
    input[type="search"]:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.5rem 1.25rem 3rem;
    }
    .run {
      margin: 2rem 0 3rem;
    }
    .run-head {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.6rem;
      margin-bottom: 1rem;
    }
    .run-head h2 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 600;
    }
    .meta { color: var(--muted); font-size: 0.95rem; }
    .themes {
      width: 100%;
      color: var(--accent);
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    figure {
      margin: 0;
    }
    figure img {
      width: 100%;
      height: auto;
      display: block;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    figcaption {
      margin-top: 0.45rem;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .empty {
      color: var(--muted);
      padding: 2rem 0;
    }
    footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.25rem 2.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>AI Art</h1>
    <p class="sub">Daily artworks from Australian news, each day locked to one artist style via local Qwen + Comfy.</p>
    <div class="controls">
      <label for="artistFilter">Filter by artist</label>
      <input id="artistFilter" type="search" placeholder="e.g. Hopper, Nolan, Adams…" autocomplete="off" />
    </div>
  </header>
  <main id="gallery"><p class="empty">Loading…</p></main>
  <footer>
    Generated locally. Source prompts and news summaries live in each run’s <code>meta.json</code>.
  </footer>
  <script>
    async function load() {
      const res = await fetch('gallery.json?_=' + Date.now());
      const data = await res.json();
      const runs = data.runs || [];
      const main = document.getElementById('gallery');
      const input = document.getElementById('artistFilter');

      function applyHashFilter() {
        const params = new URLSearchParams(location.search);
        const q = params.get('artist') || '';
        if (q) input.value = q;
        const hash = location.hash.replace(/^#\/?/, '');
        return { artist: input.value, date: /^\d{4}-\d{2}-\d{2}$/.test(hash) ? hash : '' };
      }

      function render() {
        const { artist, date } = applyHashFilter();
        const q = (input.value || artist || '').trim().toLowerCase();
        const filtered = runs.filter(r => {
          if (date && r.date !== date) return false;
          if (!q) return true;
          const hay = ((r.artist && r.artist.name) || '') + ' ' + ((r.artist && r.artist.id) || '');
          return hay.toLowerCase().includes(q);
        });
        if (!filtered.length) {
          main.innerHTML = '<p class="empty">No runs match this filter.</p>';
          return;
        }
        main.innerHTML = filtered.map(run => {
          const themes = (run.themes || []).join(' · ');
          const imgs = (run.images || []).map(img => `
            <figure>
              <img src="runs/${run.date}/${img.jpg || img.png}" alt="${escapeAttr(img.title || '')}" loading="lazy" />
              <figcaption>${escapeHtml(img.title || '')}</figcaption>
            </figure>`).join('');
          return `
            <section class="run" data-artist="${escapeAttr((run.artist && run.artist.name) || '')}" id="${run.date}">
              <div class="run-head">
                <h2>${escapeHtml((run.artist && run.artist.name) || 'Unknown')}</h2>
                <span class="meta">${escapeHtml(run.date)} · ${escapeHtml((run.artist && run.artist.renderMode) || '')}</span>
                ${themes ? `<div class="themes">${escapeHtml(themes)}</div>` : ''}
              </div>
              <div class="grid">${imgs}</div>
            </section>`;
        }).join('');
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }
      function escapeAttr(s) { return escapeHtml(s); }

      input.addEventListener('input', () => {
        const v = input.value.trim();
        const url = new URL(location.href);
        if (v) url.searchParams.set('artist', v); else url.searchParams.delete('artist');
        history.replaceState(null, '', url);
        render();
      });
      window.addEventListener('hashchange', render);
      render();
    }
    load().catch(err => {
      document.getElementById('gallery').innerHTML =
        '<p class="empty">Could not load gallery.json</p>';
      console.error(err);
    });
  </script>
</body>
</html>
